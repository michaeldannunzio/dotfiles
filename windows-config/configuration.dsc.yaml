# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
#
# Repo path: configuration.dsc.yaml
#
# WinGet Configuration for the Z690 desktop.
# Apply with:  winget configure -f configuration.dsc.yaml --accept-configuration-agreements
# Preview with: winget configure show -f configuration.dsc.yaml
# Validate with: winget configure validate -f configuration.dsc.yaml
#
# BEFORE YOU APPLY: package IDs change. Confirm each one with
#   winget search "<name>"
# Remove any line you do not want. The file is idempotent, so you can
# run it as many times as you like.

properties:
  assertions:
    - resource: Microsoft.Windows.Developer/OsVersion
      directives:
        description: Require Windows 11 23H2 or later
        allowPrerelease: true
      settings:
        MinVersion: '10.0.22631'

  resources:

    # ---------------------------------------------------------------
    # Windows features and settings
    # ---------------------------------------------------------------

    - resource: Microsoft.Windows.Developer/DeveloperMode
      id: developerMode
      directives:
        description: Enable Developer Mode, so dotfile symlinks work without admin
        allowPrerelease: true
        securityContext: elevated
      settings:
        Ensure: Present

    - resource: PSDscResources/Registry
      directives:
        description: Show file extensions
      settings:
        Key: HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        ValueName: HideFileExt
        ValueType: DWord
        ValueData: 0

    - resource: PSDscResources/Registry
      directives:
        description: Show hidden files
      settings:
        Key: HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        ValueName: Hidden
        ValueType: DWord
        ValueData: 1

    - resource: PSDscResources/Registry
      directives:
        description: Open File Explorer on This PC, not Home
      settings:
        Key: HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        ValueName: LaunchTo
        ValueType: DWord
        ValueData: 1

    - resource: PSDscResources/Registry
      directives:
        description: Align the taskbar to the left
      settings:
        Key: HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        ValueName: TaskbarAl
        ValueType: DWord
        ValueData: 0

    - resource: PSDscResources/Registry
      directives:
        description: Hide the Task View button
      settings:
        Key: HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        ValueName: ShowTaskViewButton
        ValueType: DWord
        ValueData: 0

    - resource: PSDscResources/Registry
      directives:
        description: Remove the search box from the taskbar
      settings:
        Key: HKCU:\Software\Microsoft\Windows\CurrentVersion\Search
        ValueName: SearchboxTaskbarMode
        ValueType: DWord
        ValueData: 0

    # ---------------------------------------------------------------
    # Shell and terminal
    # ---------------------------------------------------------------

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: pwsh
      directives:
        description: PowerShell 7
        allowPrerelease: true
      settings:
        id: Microsoft.PowerShell
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: terminal
      directives:
        description: Windows Terminal
        allowPrerelease: true
      settings:
        id: Microsoft.WindowsTerminal
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Starship prompt, same prompt as the Mac and WSL
        allowPrerelease: true
      settings:
        id: Starship.Starship
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: PowerToys
        allowPrerelease: true
      settings:
        id: Microsoft.PowerToys
        source: winget

    # ---------------------------------------------------------------
    # Development
    # ---------------------------------------------------------------

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: git
      directives:
        description: Git for Windows
        allowPrerelease: true
      settings:
        id: Git.Git
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: GitHub CLI
        allowPrerelease: true
      settings:
        id: GitHub.cli
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Visual Studio Code
        allowPrerelease: true
      settings:
        id: Microsoft.VisualStudioCode
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Microsoft DSC v3, needed by newer configuration files
        allowPrerelease: true
      settings:
        id: Microsoft.DSC
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: wsl
      directives:
        description: Windows Subsystem for Linux
        allowPrerelease: true
      settings:
        id: Microsoft.WSL
        source: winget

    # ---------------------------------------------------------------
    # Everyday apps
    # ---------------------------------------------------------------

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Google Drive
        allowPrerelease: true
      settings:
        id: Google.GoogleDrive
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: iCloud for Windows
        allowPrerelease: true
      settings:
        id: Apple.iCloud
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: NordVPN
        allowPrerelease: true
      settings:
        id: NordSecurity.NordVPN
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Tailscale, so the Mac can reach this machine
        allowPrerelease: true
      settings:
        id: Tailscale.Tailscale
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Firefox
        allowPrerelease: true
      settings:
        id: Mozilla.Firefox
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: 7-Zip
        allowPrerelease: true
      settings:
        id: 7zip.7zip
        source: winget

  configurationVersion: 0.2.0
